version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      dev-deps:
        patterns: ["*"]
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-deps:
        patterns: ["*"]
        dependency-type: "production"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
